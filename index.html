<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VKU Field Survey</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="app-card">
        <header class="header">
            <div class="brand">
                <span class="logo-icon">📋</span>
                <div>
                    <h1>VKU Field Survey</h1>
                    <span class="version-tag">Capacitor Native</span>
                </div>
            </div>
            <div id="status-bar" class="status-badge status-online">
                <span class="status-dot"></span>
                <span id="status-text">Online</span>
            </div>
        </header>

        <form id="survey-form">
            <div class="form-group">
                <label for="interviewer">Người khảo sát <span class="required">*</span></label>
                <input type="text" id="interviewer" required placeholder="Nhập họ và tên...">
            </div>

            <div class="form-group">
                <label for="topic">Khu vực khảo sát <span class="required">*</span></label>
                <select id="topic" required>
                    <option value="" disabled selected>-- Chọn khu vực --</option>
                    <option value="Phòng học / Giảng đường">Phòng học / Giảng đường</option>
                    <option value="Ký túc xá">Ký túc xá</option>
                    <option value="Khu thể thao">Sân thể thao / Nhà đa năng</option>
                    <option value="Căng tin / Tiện ích">Căng tin / Tiện ích</option>
                    <option value="Thư viện / Không gian tự học">Thư viện / Không gian tự học</option>
                    <option value="Khuôn viên / Bãi xe">Khuôn viên / Bãi xe</option>
                </select>
            </div>

            <div class="form-group">
                <label for="condition">Tình trạng ghi nhận <span class="required">*</span></label>
                <select id="condition" required>
                    <option value="Tốt">🟢 Tốt / Bình thường</option>
                    <option value="Cần bảo trì">🟡 Cần bảo trì</option>
                    <option value="Hỏng hóc nghiêm trọng">🔴 Hỏng hóc nghiêm trọng</option>
                </select>
            </div>

            <!-- CAMERA CAPTURE SECTION -->
            <div class="form-group">
                <label>Ảnh hiện trường</label>
                <div class="camera-section">
                    <button type="button" id="btn-camera" class="btn-action">
                        <span class="btn-icon">📷</span>
                        <span>Chụp ảnh hiện trường</span>
                    </button>
                    
                    <div id="photo-preview-container" class="photo-preview-container hidden">
                        <div class="preview-wrapper">
                            <img id="photo-preview" src="" alt="Ảnh hiện trường preview">
                            <button type="button" id="btn-remove-photo" class="btn-remove-photo" title="Xóa ảnh">&times;</button>
                        </div>
                        <span class="photo-tag">✅ Đã chụp ảnh thành công</span>
                    </div>
                </div>
            </div>

            <!-- GPS GEOLOCATION SECTION -->
            <div class="form-group">
                <label>Tọa độ GPS hiện trường</label>
                <div class="geo-section">
                    <div class="geo-info-card" id="geo-info-card">
                        <div class="geo-status">
                            <span class="geo-icon">📍</span>
                            <span id="geo-status-text">Chưa lấy tọa độ</span>
                        </div>
                        <div id="geo-coords" class="geo-coords hidden">
                            <span id="geo-coords-text">--</span>
                        </div>
                    </div>
                    <button type="button" id="btn-get-location" class="btn-action">
                        <span class="btn-icon">🛰️</span>
                        <span>Lấy vị trí GPS</span>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label for="notes">Ghi chú chi tiết</label>
                <textarea id="notes" rows="3" placeholder="Mô tả chi tiết tình trạng hiện trường..."></textarea>
            </div>

            <button type="submit" id="submit-btn" class="btn-primary">
                <span>Gửi khảo sát</span>
            </button>
        </form>

        <div class="sync-card">
            <div class="sync-info">
                <span class="sync-title">Chờ đồng bộ (Offline)</span>
                <span class="sync-count" id="pending-count">0</span>
            </div>
            <button id="sync-btn" class="btn-secondary" type="button">Đồng bộ ngay</button>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>

</html>
